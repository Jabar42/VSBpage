<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterclass Gratuita - IA en la Clínica Veterinaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #00CED1 0%, #20B2AA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .free-badge {
            background: #FF0000;
            color: #FFD700;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            border: 3px solid #000;
            display: inline-block;
            margin-bottom: 1rem;
            text-transform: uppercase;
            font-family: 'Comic Sans MS', cursive;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            color: #00CED1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #000;
            margin-bottom: 2rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-details {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            margin: 2rem 0;
            border: 2px solid #00CED1;
        }

        .date-time {
            font-size: 2rem;
            font-weight: bold;
            color: #00CED1;
            margin-bottom: 0.5rem;
        }

        .time {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .platform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .platform img {
            width: 24px;
            height: 24px;
        }

        .gift-section {
            background: #FFF8DC;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1.5rem 0;
            border: 2px dashed #FFD700;
        }

        .gift-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            margin-bottom: 0.5rem;
        }

        .gift-icon {
            font-size: 2rem;
            margin: 0.5rem 0;
        }

        .speaker-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .speaker-info {
            text-align: left;
            flex: 1;
            min-width: 300px;
        }

        .speaker-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00CED1;
            margin-bottom: 0.5rem;
        }

        .speaker-title {
            font-size: 1rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .mvz-badge {
            background: #00CED1;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            display: inline-block;
        }

        .form-container {
            background: #f7fafc;
            padding: 2rem;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #00CED1;
            box-shadow: 0 0 0 3px rgba(0, 206, 209, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #00CED1 0%, #20B2AA 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 206, 209, 0.3);
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-weight: bold;
            color: #00CED1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .main-title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .speaker-section {
                flex-direction: column;
                text-align: center;
            }
            
            .speaker-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="free-badge">FREE</div>
        
        <h1 class="main-title">MASTERCLASS</h1>
        <h2 class="subtitle">IA EN LA CLÍNICA DIARIA: VETERINARIOS MÁS EFICIENTES</h2>
        
        <div class="event-details">
            <div class="date-time">12/Ago</div>
            <div class="time">7:30 P.M. Hora COL 🇨🇴</div>
            <div class="platform">
                <span>📹</span>
                <span>Google Meet</span>
            </div>
        </div>
        
        <div class="gift-section">
            <div class="gift-text">NO TE LO PIERDAS</div>
            <div class="gift-text">Tendremos regalos</div>
            <div class="gift-icon">🎁</div>
        </div>
        
        <div class="speaker-section">
            <div class="speaker-info">
                <div class="speaker-name">NICOLÁS PEDRAZA</div>
                <div class="speaker-title">MVZ y experto en marketing</div>
                <div class="mvz-badge">MVZ</div>
            </div>
        </div>
        
        <div class="form-container">
            <form name="contact" netlify data-netlify="true">
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="tu@email.com"
                        required
                    />
                </div>
                
                <button type="submit" class="submit-btn">
                    Registrarme en la Masterclass
                </button>
            </form>
        </div>
        
        <div class="logos">
            <div class="logo">Vetic</div>
            <div class="logo">Veterinario sin</div>
        </div>
    </div>

    <script>
        // Handle form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const submitBtn = document.querySelector('.submit-btn');
            
            // Show loading state
            submitBtn.textContent = 'Enviando...';
            submitBtn.disabled = true;
            
            // Submit form using Netlify's form handling
            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formData)
            })
            .then(response => {
                if (response.ok) {
                    // Redirect to thank you page
                    window.location.href = 'thank-you.html';
                } else {
                    throw new Error('Network response was not ok');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al enviar el formulario. Por favor, intenta de nuevo.');
            })
            .finally(() => {
                submitBtn.textContent = 'Registrarme en la Masterclass';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
